<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        ::selection{
            background:#2563eb;
            color:white;
        }
    </style>
</head>

<body class="app-body min-h-screen">

    <!-- Navbar -->
    <nav class="site-nav sticky top-0 z-50">
        <div class="nav-inner max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="index.html" class="site-brand text-2xl font-bold tracking-wider">
                <span class="text-blue-500">M</span>ovie
                <span class="text-blue-500">H</span>ub
            </a>

            <a
                href="index.html"
                class="detail-back px-5 py-2 transition">
                <span aria-hidden="true">←</span> Back
            </a>

        </div>
    </nav>

    <!-- Page Heading -->
    <section class="details-heading text-center py-10 px-4">
        <p class="eyebrow">From the archive</p>
        <h1 class="text-4xl md:text-5xl font-bold">
            The full picture
        </h1>

        <p class="text-slate-400 mt-3">
            Complete information about your selected movie
        </p>
    </section>

    <!-- Movie Content -->
    <main id="movie-detail" class="detail-main pb-16">
        <!-- movie-details.js yaha content inject karega -->
    </main>

    <!-- Footer -->
    <footer class="app-footer border-t border-white/10 py-8 text-center mt-10">
        <p class="text-slate-400">
            © 2026 Movie Hub. All Rights Reserved.
        </p>
    </footer>

    <script src="movie-details.js"></script>

</body>
</html>
