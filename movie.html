<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body min-h-screen">

  <!-- Navbar -->
     <nav class="site-nav sticky top-0 z-50">
       <div class="nav-inner max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <h1 class="site-brand text-2xl md:text-3xl font-bold tracking-wider">
                <span class="text-blue-500">M</span>ovie
                <span class="text-blue-500">H</span>ub
            </h1>

            <!-- Desktop Menu -->
            <ul class="nav-links hidden md:flex gap-8 font-medium">
                <li><a href="index.html" class="hover:text-blue-400 transition">Home</a></li>
                <li><a href="movie.html" class="hover:text-blue-400 transition">Movies</a></li>
                <li><a href="about.html" class="hover:text-blue-400 transition">About</a></li>
            </ul>

            <!-- Mobile Menu Button -->
            <button id="menuBtn" class="menu-button md:hidden" aria-label="Open navigation menu" aria-expanded="false">
                <svg class="w-8 h-8"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>

        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu" class="mobile-menu hidden md:hidden">

            <ul class="flex flex-col text-center">

                <li>
                    <a href="index.html"
                       class="block py-4 hover:bg-blue-600 transition">
                        Home
                    </a>
                </li>

                <li>
                    <a href="movie.html"
                       class="block py-4 hover:bg-blue-600 transition">
                        Movies
                    </a>
                </li>

                <li>
                    <a href="about.html"
                       class="block py-4 hover:bg-blue-600 transition">
                        About
                    </a>
                </li>

            </ul>
        </div>
    </nav>

  <!-- Hero -->
  <section class="catalog-hero text-center py-16 px-6">

    <p class="eyebrow">Now showing</p>

    <h2 class="text-5xl font-bold mb-4">
      On the marquee
    </h2>

    <p class="text-slate-400 mb-8">
      Find a familiar favorite or follow a new thread.
    </p>

    <form id="movieForm" class="search-form flex justify-center gap-3 flex-wrap">

      <input
        id="movieInput"
        type="text"
        placeholder="Search the movie archive..."
        class="search-input w-[450px] max-w-full px-5 py-3 outline-none">

      <button
        type="submit"
        class="search-button px-6 py-3">
        Search <span aria-hidden="true">↗</span>
      </button>

    </form>

  </section>

  <!-- Trending Movies -->
  <section id="movies" class="catalog-results max-w-7xl mx-auto px-6">

    <p class="eyebrow">A few worth your time</p>
    <h2 class="text-3xl font-bold mb-8">Popular this week</h2>

    <div
      id="movieHub"
      class="movie-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    </div>

  </section>

      <!-- Footer -->
    <footer class="app-footer border-t border-white/10 py-8 text-center">

         <h2 class="site-brand text-2xl md:text-3xl font-bold tracking-wider">
                <span class="text-blue-500">M</span>ovie
                <span class="text-blue-500">H</span>ub
            </h2>

        <p class="text-slate-400 mb-4">
            Your gateway to discovering amazing movies.
        </p>

        <p class="text-slate-500 text-sm">
            © 2026 Movie Hub. All Rights Reserved.
        </p>

    </footer>
        <script>
        const menuBtn = document.getElementById("menuBtn");
        const mobileMenu = document.getElementById("mobileMenu");

        menuBtn.addEventListener("click", () => {
          const isOpen = mobileMenu.classList.toggle("hidden");
          menuBtn.setAttribute("aria-expanded", String(!isOpen));
        });
    </script>

  <script src="movie.js"></script>

</body>
</html>
